    stroke-linejoin="round"
  />

  <!-- Legal Scales & Pillar Emblem -->
  <!-- Top Finial -->
  <circle cx="64" cy="34" r="3.5" fill="url(#lta-gold)" />

  <!-- Balance Beam -->
  <path
    d="M40 45.5C47 41.5 55.5 41.5 64 41.5C72.5 41.5 81 41.5 88 45.5"
    stroke="url(#lta-gold)"
