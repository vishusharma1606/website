  />

  <!-- Left Scale -->
  <path d="M41 46L33.5 63.5H48.5L41 46Z" stroke="url(#lta-gold)" stroke-width="2" stroke-linejoin="round" />
  <path d="M32 63.5C32 68.2 36 71.5 41 71.5C46 71.5 50 68.2 50 63.5H32Z" fill="url(#lta-gold)" />

  <!-- Right Scale -->
  <path d="M87 46L79.5 63.5H94.5L87 46Z" stroke="url(#lta-gold)" stroke-width="2" stroke-linejoin="round" />
  <path d="M78 63.5C78 68.2 82 71.5 87 71.5C92 71.5 96 68.2 96 63.5H78Z" fill="url(#lta-gold)" />

  <!-- Central Pillar -->
