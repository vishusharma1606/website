<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="lta-navy" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b284d" />
      <stop offset="55%" stop-color="#071b34" />
      <stop offset="100%" stop-color="#041022" />
    </linearGradient>
    <linearGradient id="lta-gold" x1="24" y1="18" x2="104" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fae596" />
      <stop offset="45%" stop-color="#dfb944" />
      <stop offset="100%" stop-color="#b48814" />
    </linearGradient>
    <linearGradient id="lta-gold-soft" x1="32" y1="24" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7df88" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Outer Executive Badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#lta-navy)" />
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" stroke="url(#lta-gold)" stroke-width="2.5" />

  <!-- Subtle Inner Shield Frame -->
  <path
    d="M64 20L98 32V61C98 83.5 83.4 99.6 64 107C44.6 99.6 30 83.5 30 61V32L64 20Z"
    fill="url(#lta-gold-soft)"
    stroke="url(#lta-gold)"
