  <!-- Stepped Pedestal Base -->
  <rect x="52" y="81.5" width="24" height="4" rx="2" fill="url(#lta-gold)" />
  <rect x="46" y="87.5" width="36" height="4.5" rx="2.25" fill="url(#lta-gold)" />
